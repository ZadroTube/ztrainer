name: Frontend CI Quality Verification

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  verify-frontend:
    name: Verify Frontend (React/TS)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'package-lock.json'

      - name: Install Dependencies
        run: npm ci

      - name: TypeScript Compile Check (Lint)
        run: npm run lint

      - name: Run Frontend Tests
        run: npm run test

      - name: Build Production Bundle
        run: npm run build
